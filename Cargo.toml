[package]
name = "emcsync"
version = "0.1.0"
edition = "2024"
description = "复现 Minecraft 实例的内容资源"
license = "MIT"
repository = "https://github.com/eunoia-may/emcsync"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "json", "charset", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
indicatif = "0.18"
inquire = "0.9"
anstream = "1"
owo-colors = "4"
rust-i18n = "4"
sys-locale = "0.3"
anyhow = "1"
thiserror = "2"
